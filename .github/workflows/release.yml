name: Release Crona for macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Validate release metadata
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          printf '%s' "${VERSION}" | grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+(-beta[.][0-9]+)?$'
          BASE_VERSION="${VERSION%%-*}"
          PROJECT_VERSION="$(xcodebuild -project crona.xcodeproj -scheme crona -configuration Release -showBuildSettings | awk '/MARKETING_VERSION =/{print $3; exit}')"
          BUILD_VERSION="$(xcodebuild -project crona.xcodeproj -scheme crona -configuration Release -showBuildSettings | awk '/CURRENT_PROJECT_VERSION =/{print $3; exit}')"
          test "${PROJECT_VERSION}" = "${BASE_VERSION}" || {
            echo "MARKETING_VERSION ${PROJECT_VERSION} does not match ${BASE_VERSION}" >&2
            exit 1
          }
          printf '%s' "${BUILD_VERSION}" | grep -Eq '^[0-9]+([.][0-9]+){0,2}$'
          test -n "${SPARKLE_PUBLIC_ED_KEY}"

          mkdir -p feed
          if curl --fail --silent --show-error \
            "https://webxsid.github.io/crona-macos/appcast.xml" \
            -o feed/appcast.xml; then
            LATEST_BUILD="$(ruby -r rexml/document -e '
              doc = REXML::Document.new(File.read(ARGV[0]))
              versions = []
              REXML::XPath.each(doc, "//*[local-name()=\"version\"]") { |node| versions << node.text.to_s }
              puts versions.max_by { |value| value.split(".").map(&:to_i) } || "0"
            ' feed/appcast.xml)"
            ruby -e '
              def parts(value)
                value.split(".").map(&:to_i).fill(0, value.split(".").length...3)
              end
              abort("CURRENT_PROJECT_VERSION must exceed appcast build #{ARGV[1]}") unless (parts(ARGV[0]) <=> parts(ARGV[1])) == 1
            ' "${BUILD_VERSION}" "${LATEST_BUILD}"
          fi

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project crona.xcodeproj \
            -scheme crona \
            -clonedSourcePackagesDirPath .build/SourcePackages

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="${RUNNER_TEMP}/developer-id.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/release.keychain-db"
          printf '%s' "${CERTIFICATE_P12_BASE64}" | base64 -D > "${CERTIFICATE_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" \
            -P "${CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${KEYCHAIN_PATH}"
          security list-keychain -d user -s "${KEYCHAIN_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"

      - name: Archive and export
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_CHANNEL="stable"
          if [[ "${RELEASE_VERSION}" == *-beta.* ]]; then
            RELEASE_CHANNEL="beta"
          fi
          xcodebuild archive \
            -project crona.xcodeproj \
            -scheme crona \
            -configuration Release \
            -archivePath "${RUNNER_TEMP}/Crona.xcarchive" \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -destination "generic/platform=macOS" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM=8QB9GBLWP5 \
            CRONA_RELEASE_CHANNEL="${RELEASE_CHANNEL}" \
            CRONA_RELEASE_VERSION="${RELEASE_VERSION}" \
            CRONA_SPARKLE_PUBLIC_KEY="${SPARKLE_PUBLIC_ED_KEY}"
          xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/Crona.xcarchive" \
            -exportPath "${RUNNER_TEMP}/export" \
            -exportOptionsPlist Config/ExportOptions.plist

      - name: Notarize application
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY_P8}" > "${KEY_PATH}"
          ditto -c -k --keepParent \
            "${RUNNER_TEMP}/export/crona.app" \
            "${RUNNER_TEMP}/notarization.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/notarization.zip" \
            --key "${KEY_PATH}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER_ID}" \
            --wait
          xcrun stapler staple "${RUNNER_TEMP}/export/crona.app"
          xcrun stapler validate "${RUNNER_TEMP}/export/crona.app"

      - name: Package release artifacts
        id: package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BASE_VERSION="${VERSION%%-*}"
          ARCHIVE_NAME="Crona-${VERSION}-macOS.zip"
          DMG_NAME="Crona-${VERSION}-macOS.dmg"
          DSYM_NAME="Crona-${VERSION}-dSYMs.zip"
          DMG_ROOT="${RUNNER_TEMP}/dmg-root"
          rm -rf "${DMG_ROOT}"
          mkdir -p "${DMG_ROOT}"

          ditto -c -k --sequesterRsrc --keepParent \
            "${RUNNER_TEMP}/export/crona.app" \
            "${RUNNER_TEMP}/${ARCHIVE_NAME}"
          ditto -c -k --keepParent \
            "${RUNNER_TEMP}/Crona.xcarchive/dSYMs/crona.app.dSYM" \
            "${RUNNER_TEMP}/${DSYM_NAME}"
          ditto "${RUNNER_TEMP}/export/crona.app" "${DMG_ROOT}/Crona.app"
          ln -s /Applications "${DMG_ROOT}/Applications"
          if diskutil image create --help >/dev/null 2>&1; then
            diskutil image create from \
              --volumeName "Crona" \
              --format UDZO \
              "${DMG_ROOT}" \
              "${RUNNER_TEMP}/${DMG_NAME}"
          else
            hdiutil create \
              -volname "Crona" \
              -srcfolder "${DMG_ROOT}" \
              -format UDZO \
              "${RUNNER_TEMP}/${DMG_NAME}"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "base_version=${BASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "archive=${ARCHIVE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "dmg=${DMG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "dsym=${DSYM_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Sign, notarize, and validate disk image
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          DMG_NAME: ${{ steps.package.outputs.dmg }}
        run: |
          set -euo pipefail
          DMG_PATH="${RUNNER_TEMP}/${DMG_NAME}"
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY_P8}" > "${KEY_PATH}"

          codesign \
            --force \
            --sign "Developer ID Application" \
            --timestamp \
            "${DMG_PATH}"
          codesign --verify --strict --verbose=2 "${DMG_PATH}"
          xcrun notarytool submit "${DMG_PATH}" \
            --key "${KEY_PATH}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER_ID}" \
            --wait
          xcrun stapler staple "${DMG_PATH}"
          xcrun stapler validate "${DMG_PATH}"
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=2 \
            "${DMG_PATH}"

          MOUNT_POINT="${RUNNER_TEMP}/mounted-dmg"
          mkdir -p "${MOUNT_POINT}"
          if diskutil image attach --help >/dev/null 2>&1; then
            diskutil image attach \
              --nobrowse \
              --readOnly \
              --mountPoint "${MOUNT_POINT}" \
              "${DMG_PATH}"
            trap 'diskutil eject "${MOUNT_POINT}"' EXIT
          else
            hdiutil attach \
              -nobrowse \
              -readonly \
              -mountpoint "${MOUNT_POINT}" \
              "${DMG_PATH}"
            trap 'hdiutil detach "${MOUNT_POINT}"' EXIT
          fi

          test -d "${MOUNT_POINT}/Crona.app"
          test -L "${MOUNT_POINT}/Applications"
          test "$(readlink "${MOUNT_POINT}/Applications")" = "/Applications"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${MOUNT_POINT}/Crona.app/Contents/Info.plist")" = "com.webxsid.crona"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${MOUNT_POINT}/Crona.app/Contents/Info.plist")" = "${{ steps.package.outputs.base_version }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CRONA_RELEASE_VERSION' "${MOUNT_POINT}/Crona.app/Contents/Info.plist")" = "${{ steps.package.outputs.version }}"
          codesign --verify --deep --strict --verbose=2 "${MOUNT_POINT}/Crona.app"
          xcrun stapler validate "${MOUNT_POINT}/Crona.app"
          lipo "${MOUNT_POINT}/Crona.app/Contents/MacOS/crona" -verify_arch arm64
          lipo "${MOUNT_POINT}/Crona.app/Contents/MacOS/crona" -verify_arch x86_64

      - name: Generate release checksums
        env:
          ARCHIVE_NAME: ${{ steps.package.outputs.archive }}
          DMG_NAME: ${{ steps.package.outputs.dmg }}
          DSYM_NAME: ${{ steps.package.outputs.dsym }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          shasum -a 256 \
            "${ARCHIVE_NAME}" \
            "${DMG_NAME}" \
            "${DSYM_NAME}" \
            > checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive }}
          DMG_NAME: ${{ steps.package.outputs.dmg }}
          DSYM_NAME: ${{ steps.package.outputs.dsym }}
        run: |
          set -euo pipefail
          PRERELEASE=()
          if [[ "${GITHUB_REF_NAME}" == *-beta.* ]]; then
            PRERELEASE=(--prerelease)
          else
            PRERELEASE=(--latest)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            --title "Crona ${GITHUB_REF_NAME#v}" \
            "${PRERELEASE[@]}" \
            "${RUNNER_TEMP}/${ARCHIVE_NAME}" \
            "${RUNNER_TEMP}/${DMG_NAME}" \
            "${RUNNER_TEMP}/checksums.txt" \
            "${RUNNER_TEMP}/${DSYM_NAME}"

      - name: Generate signed appcast
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cp "${RUNNER_TEMP}/${ARCHIVE_NAME}" "feed/${ARCHIVE_NAME}"
          gh release view "${GITHUB_REF_NAME}" --json body --jq .body > "feed/Crona-${VERSION}-macOS.md"
          GENERATE_APPCAST="$(find .build/SourcePackages/artifacts -type f -name generate_appcast -perm +111 | head -1)"
          test -x "${GENERATE_APPCAST}"
          CHANNEL=()
          if [[ "${GITHUB_REF_NAME}" == *-beta.* ]]; then
            CHANNEL=(--channel beta)
          fi
          printf '%s' "${SPARKLE_EDDSA_PRIVATE_KEY}" | "${GENERATE_APPCAST}" \
            --ed-key-file - \
            --maximum-versions 0 \
            --download-url-prefix "https://github.com/webxsid/crona-macos/releases/download/${GITHUB_REF_NAME}/" \
            --release-notes-url-prefix "https://webxsid.github.io/crona-macos/" \
            "${CHANNEL[@]}" \
            feed
          rm -f "feed/${ARCHIVE_NAME}"
          rm -rf feed/old_updates

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: feed

      - name: Deploy appcast
        id: pages
        uses: actions/deploy-pages@v4
